openapi: 3.0.3
info:
  title: Request context fixture
  version: 1.0.0
paths:
  /context/{itemId}:
    post:
      operationId: request_context
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: q
          in: query
          required: true
          schema:
            type: string
            enum: [left hand, right hand]
            minLength: 4
            maxLength: 10
        - name: X-Trace
          in: header
          required: true
          schema:
            type: string
            enum: [abc, def]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Echo selected request context
