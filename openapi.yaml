openapi: 3.0.3
info:
  title: Bash HTTP Lab Catalog
  version: 0.1.0
paths:
  /health:
    get:
      operationId: health
      x-middlewares: [requestId, logging]
      responses:
        '200':
          description: Runtime health
          content:
            application/json: {}
            application/yaml: {}
            text/yaml: {}
  /books:
    get:
      operationId: list_books
      x-middlewares: [requestId, logging]
      responses:
        '200':
          description: Books in the example catalog
          content:
            application/json: {}
            application/yaml: {}
            text/yaml: {}
  /books/{bookId}:
    get:
      operationId: get_book
      x-middlewares: [requestId, logging]
      parameters:
        - name: bookId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: One book
          content:
            application/json: {}
            application/yaml: {}
            text/yaml: {}
        '404':
          description: Book not found
          content:
            application/json: {}
            application/yaml: {}
            text/yaml: {}
  /authors:
    get:
      operationId: list_authors
      x-middlewares: [requestId, logging]
      responses:
        '200':
          description: Authors in the example catalog
          content:
            application/json: {}
            application/yaml: {}
            text/yaml: {}
  /authors/{authorId}:
    get:
      operationId: get_author
      x-middlewares: [requestId, logging]
      parameters:
        - name: authorId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: One author
          content:
            application/json: {}
            application/yaml: {}
            text/yaml: {}
        '404':
          description: Author not found
          content:
            application/json: {}
            application/yaml: {}
            text/yaml: {}
